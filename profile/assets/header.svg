<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#111424"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <radialGradient id="glow-left" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-right" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Glow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 64px;
      letter-spacing: 4px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 19px;
      letter-spacing: 3px;
      fill: #A5B4FC;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #C7D2FE;
    }
    .glow-pulse {
      animation: pulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Card Background -->
  <rect x="4" y="4" width="992" height="232" rx="20" fill="url(#bg-grad)" stroke="url(#accent-grad)" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Glow Overlays -->
  <rect x="4" y="4" width="992" height="232" rx="20" fill="url(#glow-left)"/>
  <rect x="4" y="4" width="992" height="232" rx="20" fill="url(#glow-right)"/>

  <!-- Subtle Geometric Grid / Circuit accents -->
  <g opacity="0.15" stroke="#8B5CF6" stroke-width="1">
    <line x1="100" y1="20" x2="100" y2="220" stroke-dasharray="4 6"/>
    <line x1="900" y1="20" x2="900" y2="220" stroke-dasharray="4 6"/>
    <circle cx="100" cy="50" r="4" fill="#6366F1"/>
    <circle cx="100" cy="190" r="4" fill="#8B5CF6"/>
    <circle cx="900" cy="50" r="4" fill="#EC4899"/>
    <circle cx="900" cy="190" r="4" fill="#6366F1"/>
  </g>

  <!-- Main Title -->
  <g text-anchor="middle">
    <!-- Top Micro Tag -->
    <rect x="400" y="32" width="200" height="26" rx="13" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.4"/>
    <text x="500" y="49" class="badge-text" text-anchor="middle">RESEARCH &amp; ENGINEERING</text>

    <!-- Organization Name -->
    <text x="500" y="125" class="title">SCAIBU</text>

    <!-- Subtitle -->
    <text x="500" y="165" class="subtitle">Next-Gen AI Architectures &amp; Distributed Systems</text>

    <!-- Accent Underline -->
    <rect x="350" y="185" width="300" height="3" rx="1.5" fill="url(#accent-grad)"/>
  </g>
</svg>
